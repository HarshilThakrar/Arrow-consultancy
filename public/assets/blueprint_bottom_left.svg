<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none" stroke="#71717a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Perspective 3D Architectural Blueprint Wireframe (Isometric Building Structure) -->
  
  <!-- Foundation & Base grid -->
  <polygon points="50,380 280,440 550,370 320,310" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="50" y1="380" x2="320" y2="310" stroke="#71717a" stroke-width="1.5"/>
  <line x1="280" y1="440" x2="550" y2="370" stroke="#71717a" stroke-width="1.5"/>

  <!-- Level 1 Plinth -->
  <polygon points="70,360 270,410 520,350 320,300" stroke="#52525b" stroke-width="1.5"/>
  <line x1="70" y1="360" x2="70" y2="330" stroke="#71717a" stroke-width="1.5"/>
  <line x1="270" y1="410" x2="270" y2="380" stroke="#71717a" stroke-width="1.5"/>
  <line x1="520" y1="350" x2="520" y2="320" stroke="#71717a" stroke-width="1.5"/>
  <polygon points="70,330 270,380 520,320 320,270" stroke="#52525b" stroke-width="1.5"/>

  <!-- Columns Level 1 to Level 2 -->
  <line x1="100" y1="337" x2="100" y2="240" stroke="#71717a" stroke-width="1.8"/>
  <line x1="160" y1="352" x2="160" y2="255" stroke="#71717a" stroke-width="1.8"/>
  <line x1="220" y1="367" x2="220" y2="270" stroke="#71717a" stroke-width="1.8"/>
  <line x1="270" y1="380" x2="270" y2="280" stroke="#3f3f46" stroke-width="2"/>
  <line x1="340" y1="363" x2="340" y2="263" stroke="#71717a" stroke-width="1.8"/>
  <line x1="410" y1="347" x2="410" y2="247" stroke="#71717a" stroke-width="1.8"/>
  <line x1="480" y1="330" x2="480" y2="230" stroke="#71717a" stroke-width="1.8"/>

  <!-- Floor 2 Slab Projection -->
  <polygon points="80,240 270,285 500,230 310,185" stroke="#3f3f46" stroke-width="1.8"/>
  <polygon points="80,245 270,290 500,235 310,190" stroke="#71717a" stroke-width="1.2"/>
  <!-- Overhang balconies -->
  <line x1="50" y1="247" x2="80" y2="240" stroke="#b89565" stroke-width="1.5"/>
  <line x1="270" y1="305" x2="270" y2="290" stroke="#b89565" stroke-width="1.5"/>
  <polygon points="50,247 270,305 270,290 80,240" stroke="#b89565" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Columns Level 2 to Level 3 -->
  <line x1="100" y1="245" x2="100" y2="155" stroke="#71717a" stroke-width="1.8"/>
  <line x1="180" y1="264" x2="180" y2="174" stroke="#71717a" stroke-width="1.8"/>
  <line x1="270" y1="285" x2="270" y2="195" stroke="#3f3f46" stroke-width="2"/>
  <line x1="360" y1="263" x2="360" y2="173" stroke="#71717a" stroke-width="1.8"/>
  <line x1="450" y1="242" x2="450" y2="152" stroke="#71717a" stroke-width="1.8"/>

  <!-- Floor 3 Slab with Pergola / Trellis -->
  <polygon points="90,155 270,195 470,150 290,110" stroke="#3f3f46" stroke-width="1.8"/>
  <!-- Trellis roof beams -->
  <line x1="110" y1="150" x2="290" y2="105" stroke="#71717a" stroke-width="1.2"/>
  <line x1="140" y1="157" x2="320" y2="112" stroke="#71717a" stroke-width="1.2"/>
  <line x1="170" y1="164" x2="350" y2="119" stroke="#71717a" stroke-width="1.2"/>
  <line x1="200" y1="171" x2="380" y2="126" stroke="#71717a" stroke-width="1.2"/>
  <line x1="230" y1="178" x2="410" y2="133" stroke="#71717a" stroke-width="1.2"/>
  
  <!-- Architectural Dimension & Extension Guidelines -->
  <line x1="30" y1="410" x2="570" y2="280" stroke="#b89565" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="270" y1="440" x2="270" y2="70" stroke="#b89565" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.7"/>
  
  <!-- Modular Glass mullion lines -->
  <line x1="130" y1="252" x2="130" y2="164" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="150" y1="257" x2="150" y2="169" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="210" y1="271" x2="210" y2="183" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="240" y1="278" x2="240" y2="190" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="310" y1="275" x2="310" y2="185" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="390" y1="256" x2="390" y2="166" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="420" y1="249" x2="420" y2="159" stroke="#a1a1aa" stroke-width="1"/>
</svg>